name: Release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# or run manually from the Actions tab, supplying the tag.
#
# `release.yml` only ever runs on a tag, so a change to it is unverifiable
# except by cutting a release — and a broken release tag is public and
# half-published. Hence `dry_run`: dispatch with an existing tag and it builds,
# packages, gathers and checksums exactly as a real release does, then stops
# before publishing anything or touching the tap. Use it after editing this
# file.
#
# A tag whose version carries a semver prerelease — `v3.0.0-alpha.1`, anything
# with a `-` after the version — is published as a GitHub prerelease and does
# **not** touch the Homebrew tap. The tap holds one formula and `brew upgrade`
# reads it, so publishing an alpha there hands it to every stable user; and
# `livecheck`'s `:github_latest` strategy skips prereleases, so a stable
# formula left alone keeps pointing at the last stable release. Prereleases
# ship as downloadable archives and nothing else, which is what a prerelease
# is for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
      dry_run:
        description: 'Build and package only — publish nothing, touch no tap'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # One job so the derivation lives in one place. Matrix jobs can declare
  # outputs, but which matrix leg's value survives is unspecified when they
  # differ — not a race worth inviting for two `${ref#v}` expansions.
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      dry: ${{ steps.ver.outputs.dry }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Semver: everything after the first `-` is the prerelease
          # identifier. `3.0.0` has none, `3.0.0-alpha.1` does.
          case "$version" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"
                 echo "::notice::$ref is a prerelease — GitHub prerelease, no tap" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # On `push` there are no inputs at all, so this is empty and the
          # release is real. Only an explicit dispatch can ask for a dry run.
          # The publish steps gate on `dry == 'false'` rather than
          # `!= 'true'`, so this output going missing blocks a release instead
          # of publishing one that was asked to be a rehearsal. A release that
          # did not happen can be re-run; one that did cannot be unpublished.
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run — building $ref, publishing nothing"
          else
            echo "dry=false" >> "$GITHUB_OUTPUT"
          fi

      # The tag names the artifacts; build.zig.zon is what `zrk --version`
      # prints. Nothing made the two agree, and until now one thing caught it
      # late: the Homebrew formula's `assert_match version.to_s` against
      # `zrk --version`, on install. A prerelease does not go to the tap, so
      # that backstop is gone for exactly the releases most likely to be cut in
      # a hurry — which is why the check moves here, before anything is built.
      - name: Tag and manifest agree
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          # The only `.version` in the file: a dependency entry carries a `.url`
          # and a `.hash`, never a version.
          manifest=$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",$/\1/p' build.zig.zon | head -1)
          [ -n "$manifest" ] || { echo "no .version in build.zig.zon"; exit 1; }
          if [ "$manifest" != "$version" ]; then
            echo "tag says $version, build.zig.zon says $manifest" >&2
            echo "bump .version in build.zig.zon to match the tag" >&2
            exit 1
          fi
          echo "tag and manifest agree on $version"

  # Zig cross-compiles any target from any host, so these could all run on one
  # runner — and did, serially, for 15 minutes. Each leg builds BoringSSL from
  # source, which is most of that; four runners turn a sum into a maximum.
  build:
    name: build ${{ matrix.label }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # Which target broke is the useful answer, not that one did.
      fail-fast: false
      matrix:
        include:
          # Linux and macOS only. The Windows targets were dropped in favour of
          # adopting ztls for TLS, which is Linux and macOS by design — its
          # `src/entropy.zig` is an outright `@compileError` anywhere else, and
          # its README scopes it to "TLS 1.3 only, on Linux and macOS … no
          # Windows portability layer". See zoxy-io/zrk#21.
          - { zig: x86_64-linux-musl,  label: x86_64-linux }
          - { zig: aarch64-linux-musl, label: aarch64-linux }
          - { zig: x86_64-macos,       label: x86_64-macos }
          - { zig: aarch64-macos,      label: aarch64-macos }
    steps:
      # A dispatch defaults to the branch it was launched from, which would
      # build one commit and label it with another's version. Build the tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Zig cross-compiles every target from this one Linux runner, using the
      # exact Zig 0.17 the flake pins.
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and package
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          mkdir -p dist
          nix develop --command zig build \
            -Dtarget="${{ matrix.zig }}" -Doptimize=ReleaseFast --prefix out
          # Tar here, before the artifact layer sees it: `upload-artifact` zips
          # its payload and drops the executable bit. Inside a tarball the mode
          # is data, so it survives the round trip by construction.
          tar czf "dist/zrk-$version-${{ matrix.label }}.tar.gz" -C out/bin zrk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: zrk-${{ matrix.label }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: zrk-*
          merge-multiple: true
          path: dist

      # SHA256SUMS.txt covers all four archives, so it can only be written once
      # they are all here — a matrix leg computing its own would be four files
      # racing for one name.
      - name: Checksum
        run: |
          set -euo pipefail
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt
          count=$(ls dist/*.tar.gz | wc -l)
          [ "$count" -eq 4 ] || { echo "expected 4 archives, found $count"; exit 1; }

      # Curated notes when `docs/releases/<tag>.md` exists, generated otherwise.
      #
      # Generated notes are a commit list. That is the right answer for a patch
      # release and the wrong one for a release that takes something away: a
      # Windows user reading "release: drop the Windows targets" learns what
      # happened but not why, whether it is coming back, or what to do instead.
      - name: Select release notes
        id: notes
        run: |
          set -euo pipefail
          path="docs/releases/${{ needs.version.outputs.tag }}.md"
          if [ -f "$path" ]; then
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "using curated notes from $path"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "no $path; generating notes from commits"
          fi

      - name: Publish GitHub Release
        if: needs.version.outputs.dry == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          # GitHub declines to call a prerelease "Latest" on its own, so this
          # one flag is also what keeps the README's "latest release binary"
          # link, and the stable formula's `:github_latest` livecheck, pointing
          # at the last stable release.
          prerelease: ${{ needs.version.outputs.prerelease }}

      # Not for a prerelease: the tap holds one formula, `brew upgrade` reads
      # it, and an alpha written there is an alpha handed to every stable user.
      # `zrk-alpha` as a second formula is the shape that would let both exist,
      # and it is not built here — a prerelease ships as archives.
      - name: Update Homebrew formula
        if: needs.version.outputs.dry == 'false' && needs.version.outputs.prerelease == 'false'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          tag="${{ needs.version.outputs.tag }}"

          sha_aarch64_macos=$(grep "zrk-$version-aarch64-macos.tar.gz" dist/SHA256SUMS.txt | awk '{print $1}')
          sha_x86_64_macos=$(grep  "zrk-$version-x86_64-macos.tar.gz"  dist/SHA256SUMS.txt | awk '{print $1}')
          sha_aarch64_linux=$(grep "zrk-$version-aarch64-linux.tar.gz" dist/SHA256SUMS.txt | awk '{print $1}')
          sha_x86_64_linux=$(grep  "zrk-$version-x86_64-linux.tar.gz"  dist/SHA256SUMS.txt | awk '{print $1}')

          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"

          git clone git@github.com:zoxy-io/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/zrk.rb << FORMULA
          class Zrk < Formula
            desc "Constant-throughput HTTP load generator in Zig"
            homepage "https://zoxy.io/zrk"
            license "MIT"

            livecheck do
              url "https://github.com/zoxy-io/zrk"
              strategy :github_latest
            end

            on_macos do
              on_arm do
                url "https://github.com/zoxy-io/zrk/releases/download/$tag/zrk-$version-aarch64-macos.tar.gz"
                sha256 "$sha_aarch64_macos"
              end
              on_intel do
                url "https://github.com/zoxy-io/zrk/releases/download/$tag/zrk-$version-x86_64-macos.tar.gz"
                sha256 "$sha_x86_64_macos"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/zoxy-io/zrk/releases/download/$tag/zrk-$version-aarch64-linux.tar.gz"
                sha256 "$sha_aarch64_linux"
              end
              on_intel do
                url "https://github.com/zoxy-io/zrk/releases/download/$tag/zrk-$version-x86_64-linux.tar.gz"
                sha256 "$sha_x86_64_linux"
              end
            end

            def install
              bin.install "zrk"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/zrk --version")
            end
          end
          FORMULA

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "zrk: update to $version"
          git push

      # A guard that fails closed can fail *silently*: if `dry` were ever
      # anything but the 'false' those steps test for, a real release would
      # skip both of them and still report success — a green run that shipped
      # nothing. So check the outcome rather than trusting the condition.
      #
      # This one is deliberately `!= 'true'`: erring towards running a check is
      # the safe direction, the opposite of erring towards publishing.
      - name: Verify the release was published
        if: needs.version.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          gh release view "$tag" --json assets --jq '.assets[].name' | tee assets.txt
          count=$(grep -c '\.tar\.gz$' assets.txt)
          [ "$count" -eq 4 ] || { echo "expected 4 archives on $tag, found $count"; exit 1; }
          grep -qx 'SHA256SUMS.txt' assets.txt || { echo "no SHA256SUMS.txt on $tag"; exit 1; }

          # The same reasoning as the comment above, applied to the flag that
          # decides who gets this build. `prerelease` is passed to an action
          # rather than acted on here, so nothing else would notice it being
          # dropped — and a prerelease published as a normal release is one
          # `brew upgrade` away from being everyone's problem.
          want="${{ needs.version.outputs.prerelease }}"
          got=$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')
          [ "$got" = "$want" ] || { echo "$tag: isPrerelease is $got, expected $want"; exit 1; }

          echo "$tag published with 4 archives and checksums, prerelease=$got"

      - name: Dry run summary
        if: needs.version.outputs.dry == 'true'
        run: |
          {
            echo "### Dry run — nothing was published"
            echo
            echo "Built \`${{ needs.version.outputs.tag }}\`, packaged four archives,"
            echo "and stopped before the release and the tap."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
